name: scrape

on:
  schedule:
    # Fires as often as GitHub allows. DO NOT tune this expecting it to set the
    # sampling rate -- it doesn't. GitHub throttles scheduled workflows hard
    # (measured: 25-58 min between runs off a */15 cron, ~44 runs/day against a
    # target of 96). The sampling cadence is set INSIDE the job by scrape.py's
    # --interval/--duration loop; the schedule only has to fire often enough to
    # keep one long-running job alive. See README.md.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      interval:
        description: "seconds between polls"
        required: false
        default: "900"
      duration:
        description: "total seconds to keep polling"
        required: false
        default: "3300"

# One scraper at a time. A newly-scheduled run waits for the current one to
# finish rather than cancelling it, so runs chain back-to-back and coverage is
# continuous. (GitHub keeps at most one pending run per group; surplus pending
# runs are dropped, which is what we want -- we only ever need one successor.)
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Must exceed SCRAPE_DURATION with room for checkout, install and commit.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: scrape
        env:
          # 15 min spacing, stopping before 3300s => polls at t=0/15/30/45,
          # so each run samples for 45 min then commits.
          #
          # MEASURED, not assumed: with duration=2400 (3 polls, ~32 min of
          # runtime) the gap histogram was 21 gaps of exactly 15 min and 7 of
          # 46 min -- in-run polling is precise, but ~16 min of DEAD TIME sits
          # between one run ending and GitHub starting the next. That capped
          # the real rate at 66/day, not the 96 first claimed. Lengthening the
          # run raises the duty cycle (45 min active vs ~16 dead => ~91/day)
          # without touching the sampling interval.
          #
          # Still bounded, not maximal: data is only committed at the END of a
          # run, so the newest COMMITTED snapshot ages while a run is in
          # flight. At 45 min of polling the worst committed-staleness is
          # ~63 min (45 polling + ~2 commit + ~16 dead), which keeps margin
          # under the monitor's 90-minute threshold. Going much longer would
          # start false-positiving the monitor and lose more if a job is
          # cancelled mid-run.
          #
          # Why not faster: Lime rotates vehicle IDs every poll, so its
          # snapshots cannot be delta-encoded -- every one is a full ~36KB
          # gzipped file. At 15 min that is ~1.3 GB/year; at 2 min it would be
          # ~9.5 GB/year in a git repo, for data that cannot track individual
          # vehicles anyway. See scrape.py design note 5.
          SCRAPE_INTERVAL: ${{ github.event.inputs.interval || '900' }}
          SCRAPE_DURATION: ${{ github.event.inputs.duration || '3000' }}
        run: python3 scrape.py

      - name: commit
        # Runs even if scraping failed partway, so partial data is preserved
        # rather than discarded along with the failure.
        if: always()
        run: |
          git config user.name  "mobility-archive-bot"
          git config user.email "actions@github.com"
          git add data state
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have landed while we worked; rebase and retry.
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              sleep 5
            done
            exit 1
          fi
